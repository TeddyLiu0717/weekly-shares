<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --ink:#0f172a; --ink2:#1e293b; --mut:#64748b; --line:#e2e8f0;
    --bg:#f8fafc; --card:#ffffff;
    --violet:#7c3aed; --blue:#4f46e5; --sky:#0ea5e9; --emer:#10b981; --amber:#f59e0b; --rose:#f43f5e;
  }
  html,body{ width:1920px; height:1080px; overflow:hidden;
    font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif; color:var(--ink); }
  .stage{ width:1920px; height:1080px; position:relative; }
  .dark{ background:radial-gradient(1200px 700px at 75% -10%, #312e81 0%, #1e1b4b 42%, #0b1020 100%); color:#e2e8f0; }
  .light{ background:var(--bg); }
  .pad{ padding:88px 110px; }
  .kicker{ font-size:30px; letter-spacing:6px; color:#a5b4fc; font-weight:700; }
  h1.big{ font-size:96px; line-height:1.18; font-weight:800; margin-top:26px; letter-spacing:1px; }
  h2.sec{ font-size:56px; font-weight:800; margin-bottom:54px; }
  .grad-text{ background:linear-gradient(90deg,#a78bfa,#60a5fa,#34d399); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .chips{ display:flex; gap:22px; margin-top:64px; }
  .chip{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:18px;
    padding:26px 38px; backdrop-filter:blur(6px); }
  .chip .n{ font-size:58px; font-weight:800; color:#a78bfa; }
  .chip .l{ font-size:24px; color:#c7d2fe; margin-top:6px; }
  .foottag{ position:absolute; left:110px; bottom:64px; font-size:24px; color:#818cf8; letter-spacing:2px; }

  .cards3{ display:grid; grid-template-columns:repeat(3,1fr); gap:34px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:24px; padding:44px 40px;
    box-shadow:0 18px 50px -24px rgba(15,23,42,.25); }
  .card .ico{ font-size:52px; }
  .card h3{ font-size:34px; margin:18px 0 14px; }
  .card p{ font-size:25px; color:var(--mut); line-height:1.6; }

  /* architecture */
  .layers{ display:flex; flex-direction:column; gap:26px; }
  .layer{ display:flex; align-items:center; gap:34px; border-radius:22px; padding:30px 40px; color:#fff;
    box-shadow:0 14px 40px -18px rgba(0,0,0,.5); }
  .layer .tag{ font-size:22px; opacity:.85; width:230px; flex:none; }
  .layer .name{ font-size:38px; font-weight:800; width:360px; flex:none; }
  .layer .desc{ font-size:24px; opacity:.92; }
  .l1{ background:linear-gradient(90deg,#0f766e,#14b8a6); }
  .l2{ background:linear-gradient(90deg,#4338ca,#6366f1); }
  .l3{ background:linear-gradient(90deg,#1d4ed8,#3b82f6); }
  .l4{ background:linear-gradient(90deg,#7c2d12,#ea580c); }
  .arrow-d{ text-align:center; font-size:34px; color:#a5b4fc; line-height:1; margin:-12px 0; }
  .side{ position:absolute; right:110px; top:210px; width:420px; background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.2); border-radius:22px; padding:30px 32px; }
  .side h4{ font-size:28px; color:#fde68a; margin-bottom:14px; }
  .side li{ font-size:22px; line-height:1.9; color:#cbd5e1; list-style:none; }
  .side li::before{ content:"▸ "; color:#a78bfa; }

  /* pipeline */
  .flow{ display:flex; align-items:stretch; gap:0; margin-top:10px; }
  .step{ flex:1; background:#fff; border:2px solid #c7d2fe; border-radius:22px; padding:34px 28px; text-align:center;
    box-shadow:0 14px 40px -22px rgba(67,56,202,.4); position:relative; }
  .step .n{ width:58px; height:58px; border-radius:50%; background:#4f46e5; color:#fff; font-size:30px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  .step h3{ font-size:32px; margin-bottom:10px; }
  .step p{ font-size:21px; color:var(--mut); line-height:1.5; }
  .rarr{ display:flex; align-items:center; font-size:52px; color:#818cf8; padding:0 10px; }
  .states{ display:flex; gap:16px; margin-top:46px; flex-wrap:wrap; }
  .st{ font-size:22px; padding:12px 24px; border-radius:999px; font-weight:700; }
  .s-gray{ background:#f1f5f9; color:#64748b; } .s-blue{ background:#dbeafe; color:#1d4ed8; }
  .s-amber{ background:#fef3c7; color:#b45309; } .s-green{ background:#d1fae5; color:#047857; }

  /* chat */
  .bubble{ max-width:1200px; border-radius:26px; padding:34px 42px; font-size:34px; line-height:1.55; margin-bottom:34px; }
  .b-user{ background:linear-gradient(90deg,#4f46e5,#7c3aed); color:#fff; margin-left:auto; border-bottom-right-radius:6px; }
  .b-ai{ background:#fff; border:1px solid var(--line); border-bottom-left-radius:6px;
    box-shadow:0 14px 40px -24px rgba(15,23,42,.3); }
  .b-ai .mono{ font-family:Consolas,monospace; background:#f1f5f9; padding:2px 12px; border-radius:8px; color:#4338ca; }
  .b-ai small{ display:block; margin-top:14px; font-size:23px; color:var(--mut); }

  /* obsidian mock */
  .obs{ width:100%; height:100%; background:#1e1e2e; display:flex; flex-direction:column; }
  .titlebar{ height:64px; background:#181825; display:flex; align-items:center; padding:0 28px; gap:14px; }
  .dot{ width:15px; height:15px; border-radius:50%; }
  .tab{ margin-left:30px; color:#cdd6f4; font-size:22px; background:#313244; padding:9px 26px; border-radius:10px 10px 0 0; }
  .obody{ flex:1; display:flex; }
  .oside{ width:330px; background:#181825; border-right:1px solid #313244; padding:24px 20px; color:#cdd6f4; }
  .oside h5{ font-size:20px; color:#7f849c; margin:18px 0 10px; font-weight:600; }
  .file{ font-size:21px; padding:7px 12px; border-radius:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file.act{ background:#313244; color:#cba6f7; }
  .file .em{ color:#f9e2af; }
  .omain{ flex:1; background:#1e1e2e; padding:52px 70px; overflow:hidden; }
  .odoc{ background:#1e1e2e; color:#cdd6f4; font-size:25px; line-height:1.75; max-width:1050px; }
  .odoc h1{ font-size:44px; color:#cdd6f4; margin-bottom:8px; }
  .odoc .meta{ color:#7f849c; font-size:19px; margin-bottom:26px; font-family:Consolas,monospace; }
  .odoc h2{ font-size:29px; color:#89b4fa; margin:24px 0 10px; }
  .odoc table{ border-collapse:collapse; width:100%; font-size:21px; }
  .odoc td{ border:1px solid #45475a; padding:9px 16px; }
  .odoc .autol{ border-left:4px solid #a6e3a1; background:rgba(166,227,161,.07); padding:4px 0 4px 18px; margin:6px 0; }
  .odoc .lk{ color:#cba6f7; } .odoc ol{ padding-left:34px; } .odoc li{ margin:4px 0; }
  .oright{ width:330px; background:#181825; border-left:1px solid #313244; padding:28px 22px; color:#cdd6f4; }
  .oright h5{ font-size:20px; color:#7f849c; margin-bottom:12px; }
  .bl{ font-size:20px; padding:6px 8px; color:#89b4fa; }
  .oright .unlinked{ color:#f38ba8; }

  /* terminal */
  .term{ background:#0c0a1d; border-radius:20px; border:1px solid #312e81; overflow:hidden;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.8); margin-top:20px; }
  .termbar{ background:#1e1b4b; padding:18px 28px; display:flex; align-items:center; gap:10px; }
  .termbar .ttl{ margin-left:20px; color:#a5b4fc; font-size:22px; }
  .termbody{ padding:36px 44px; font-family:Consolas,"Courier New",monospace; font-size:27px; line-height:1.62; color:#cbd5e1; }
  .ps{ color:#34d399; } .cmd{ color:#f0abfc; } .ok{ color:#34d399; font-weight:700; }
  .warn{ color:#fbbf24; } .dim{ color:#94a3b8; }

  .rules{ display:grid; grid-template-columns:repeat(3,1fr); gap:34px; margin-top:30px; }
  .rule{ border-radius:24px; padding:46px 40px; color:#fff; min-height:430px; }
  .rule .big{ font-size:88px; font-weight:900; opacity:.25; }
  .rule h3{ font-size:36px; margin:8px 0 18px; }
  .rule p{ font-size:24px; line-height:1.65; opacity:.95; }
  .r1{ background:linear-gradient(160deg,#0f766e,#0d9488); }
  .r2{ background:linear-gradient(160deg,#6d28d9,#7c3aed); }
  .r3{ background:linear-gradient(160deg,#b45309,#f59e0b); }

  .endbox{ margin-top:70px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.2);
    border-radius:26px; padding:54px 60px; }
  .ghline{ font-family:Consolas,monospace; font-size:38px; color:#6ee7b7; margin:22px 0; }
</style>
</head>
